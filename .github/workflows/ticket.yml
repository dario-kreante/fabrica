name: Ticket de la fábrica
run-name: ${{ inputs.identifier }}

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: ID del ticket en Linear
        required: true
      identifier:
        description: Identificador visible, por ejemplo APP-1
        required: true
      model:
        description: Modelo del generador
        type: choice
        default: claude-sonnet-5-5
        options:
          - claude-sonnet-5-5
          - claude-haiku-5-5

# Un solo ticket escribiendo a la vez en este repo.
concurrency:
  group: fabrica-repo

permissions: {}

jobs:
  motor:
    permissions:
      contents: write
      pull-requests: write
    uses: dario-kreante/fabrica/.github/workflows/motor-ticket.yml@main
    secrets: inherit
    with:
      issue_id: ${{ inputs.issue_id }}
      identifier: ${{ inputs.identifier }}
      model: ${{ inputs.model }}
      trusted_ref: main
      allowed_dirs: api,lib,tests,docs
      vercel_project_id: prj_E3PakOPHWC0qEfH4Nj3RXU4bms5g
